    <script>
      // Apply theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var t = localStorage.getItem('retainhq-theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Static crawlable fallback: shown to non-JS crawlers and before the
           React bundle mounts; React replaces #root contents on render, so users
           never see it. Keeps real keyword-rich content in the served HTML. -->
      <noscript>
        <h1>RetainHQ — Automatically track what you study and remember it</h1>
        <p>
          RetainHQ keeps track of what you study and logs it for you
          automatically. Install the free RetainHQ Companion browser extension
          and the tutorials you watch, the docs you read, and the AI chats you
          learn from are turned into a study log on their own — no forms to fill
          in. You can also log anything by hand in a few seconds.
        </p>
        <p>
          Then RetainHQ brings each topic back as a short quiz, timed to reach
          you right before you'd forget it, so what you study actually sticks.
          Your dashboard shows what you still remember, not just what you
          finished. Works for anything you're learning — DSA, system design,
          Python, C++, SQL, AI engineering, core CS, and school subjects.
        </p>
      </noscript>
    </div>
    <script type="module" src="/src/main.jsx"></script>
