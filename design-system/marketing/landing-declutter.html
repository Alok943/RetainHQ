<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Landing: text diet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f9f9f6; --ink: #0F172A; --muted: #64748B;
    --hairline: rgba(15,23,42,0.10); --cyan: #0891B2; --cyan-end: #0E7490;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--ink);
    padding: 24px;
  }
  .label {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--muted); margin: 0 0 12px;
  }
  .dark-panel {
    background: #0B1120;
    border-radius: 8px;
    padding: 48px 40px;
    margin-bottom: 24px;
  }
  h1.hero {
    font-size: 28px; font-weight: 700; line-height: 1.25;
    color: #ffffff; margin: 0 0 16px; max-width: 460px;
  }
  h1.hero .accent { color: #22D3EE; }
  p.desc {
    font-size: 14px; line-height: 1.6; color: #9aa3b8;
    max-width: 440px; margin: 0 0 24px;
  }
  .cta-row { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
  .cta-primary {
    display: inline-flex; align-items: center; gap: 6px;
    background: linear-gradient(135deg, var(--cyan), var(--cyan-end));
    color: #ffffff; font-size: 14px; font-weight: 600;
    padding: 12px 22px; border-radius: 999px; border: none;
  }
  .cta-ghost {
    display: inline-flex; align-items: center; gap: 6px;
    background: transparent; color: #ffffff; font-size: 14px; font-weight: 600;
    padding: 12px 22px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.24);
  }
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; color: #9aa3b8;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px;
    padding: 3px 10px;
  }
  .caption {
    font-size: 12px; color: var(--muted); margin-top: 4px;
  }
</style>
</head>
<body>

  <div class="label">PROPOSED</div>
  <div class="dark-panel">
    <h1 class="hero">Learn it visually. <span class="accent">Remember it forever.</span></h1>
    <p class="desc">
      Step through real code, predict the output, and let spaced repetition make it stick.
    </p>
    <div class="cta-row">
      <button class="cta-primary">Try a lesson &rarr;</button>
      <button class="cta-ghost">Get Started</button>
    </div>
    <div class="chip-row">
      <span class="chip">DSA</span>
      <span class="chip">Aptitude</span>
      <span class="chip">Core CS</span>
      <span class="chip">SQL</span>
      <span class="chip">System Design</span>
      <span class="chip">Python</span>
    </div>
  </div>

  <div class="caption">Code demo stays the hook; the chip row signals breadth without prose.</div>

</body>
</html>
