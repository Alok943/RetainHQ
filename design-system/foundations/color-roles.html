<!-- @dsCard group="Colors" name="Color roles" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Color roles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --paper: #f9f9f6; --muted: #64748B; --hairline: rgba(15,23,42,0.10); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    font-family: 'Inter', system-ui, sans-serif;
    padding: 24px;
  }
  .grid {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
  }
  .swatch-card { width: 118px; text-align: left; }
  .swatch {
    width: 100%;
    height: 72px;
    border-radius: 8px;
    border: 1px solid var(--hairline);
    margin-bottom: 8px;
  }
  .role {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #0F172A;
    margin-bottom: 2px;
  }
  .job {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .hex {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }
</style>
</head>
<body>
<div class="grid">

  <div class="swatch-card">
    <div class="swatch" style="background:#f9f9f6;"></div>
    <div class="role">Paper</div>
    <div class="job">Surface</div>
    <div class="hex">#f9f9f6</div>
  </div>

  <div class="swatch-card">
    <div class="swatch" style="background:#0F172A;"></div>
    <div class="role" style="color:#f9f9f6; background:#0F172A; padding:1px 4px; border-radius:3px; display:inline-block;">Ink</div>
    <div class="job">Text</div>
    <div class="hex">#0F172A</div>
  </div>

  <div class="swatch-card">
    <div class="swatch" style="background:#0891B2;"></div>
    <div class="role">Cyan</div>
    <div class="job">Action / Due</div>
    <div class="hex">#0891B2</div>
  </div>

  <div class="swatch-card">
    <div class="swatch" style="background:#ba1a1a;"></div>
    <div class="role">Red</div>
    <div class="job">Error / Missed</div>
    <div class="hex">#ba1a1a</div>
  </div>

  <div class="swatch-card">
    <div class="swatch" style="background:#B45309;"></div>
    <div class="role">Amber</div>
    <div class="job">Hard</div>
    <div class="hex">#B45309</div>
  </div>

  <div class="swatch-card">
    <div class="swatch" style="background:#0F766E;"></div>
    <div class="role">Teal</div>
    <div class="job">Easy</div>
    <div class="hex">#0F766E</div>
  </div>

  <div class="swatch-card">
    <div class="swatch" style="background:#8B5CF6;"></div>
    <div class="role">Purple</div>
    <div class="job">AI only</div>
    <div class="hex">#8B5CF6</div>
  </div>

</div>
</body>
</html>
