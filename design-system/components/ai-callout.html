<!-- @dsCard group="Components" name="AI advisory callout" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI advisory callout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f9f9f6; --ink: #0F172A; --muted: #64748B;
    --hairline: rgba(15,23,42,0.10); --purple: #8B5CF6;
  }
  * { box-sizing: border-box; }
  body { margin:0; background: var(--paper); font-family: 'Inter', system-ui, sans-serif; padding: 24px; color: var(--ink); max-width: 520px; }
  .label {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--muted); margin-bottom: 12px;
  }
  .callout {
    border-radius: 8px;
    border: 1px solid rgba(139, 92, 246, 0.3);
    border-left: 4px solid var(--purple);
    background: rgba(139, 92, 246, 0.06);
    padding: 16px 18px;
  }
  .micro {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--purple); margin-bottom: 10px;
  }
  .body-text { font-size: 14px; line-height: 1.5; color: var(--ink); }
  .caption {
    font-size: 12px; color: var(--muted); margin-top: 16px;
  }
</style>
</head>
<body>

  <div class="label">PROPOSED</div>
  <div class="callout">
    <div class="micro">✦ AI FEEDBACK</div>
    <div class="body-text">You captured the core idea — the loop invariant — but missed that mid is recomputed each iteration.</div>
  </div>

  <div class="caption">Purple appears ONLY when the AI is suggesting; the user always decides.</div>

</body>
</html>
