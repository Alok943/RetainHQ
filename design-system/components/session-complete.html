<!-- @dsCard group="Components" name="Session complete" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Session complete</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f9f9f6; --ink: #0F172A; --muted: #64748B;
    --hairline: rgba(15,23,42,0.10); --teal: #0F766E;
  }
  * { box-sizing: border-box; }
  body {
    margin:0; background: var(--paper); font-family: 'Inter', system-ui, sans-serif;
    padding: 24px; color: var(--ink);
  }
  .label {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--muted); margin-bottom: 16px;
  }
  .panel {
    display: flex; flex-direction: column; align-items: center;
    text-align: center; padding: 40px 24px;
  }
  .check-circle {
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(15, 118, 110, 0.12);
    display: flex; align-items: center; justify-content: center;
    color: var(--teal); font-size: 18px; font-weight: 700;
    margin-bottom: 16px;
  }
  h2 { font-size: 20px; font-weight: 600; margin: 0 0 8px; color: var(--ink); }
  p.sub { font-size: 14px; color: var(--muted); margin: 0; max-width: 340px; line-height: 1.5; }
  .caption {
    font-size: 12px; color: var(--muted); text-align: center;
    margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--hairline);
  }
</style>
</head>
<body>

  <div class="label">PROPOSED</div>
  <div class="panel">
    <div class="check-circle">&#10003;</div>
    <h2>Reviews complete</h2>
    <p class="sub">You worked through 6 reviews. That's what builds long-term memory.</p>
  </div>

  <div class="caption">Earned satisfaction: one warm sentence, not a celebration screen.</div>

</body>
</html>
