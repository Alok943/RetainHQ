<!-- @dsCard group="Components" name="Due badge: red vs cyan" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Due badge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f9f9f6; --surface: #ffffff; --ink: #0F172A; --muted: #64748B;
    --hairline: rgba(15,23,42,0.10); --red: #ba1a1a; --cyan: #0891B2;
  }
  * { box-sizing: border-box; }
  body { margin:0; background: var(--paper); font-family: 'Inter', system-ui, sans-serif; padding: 24px; color: var(--ink); }
  .cols { display: flex; gap: 32px; }
  .col { flex: 1; }
  .label {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--muted); margin-bottom: 12px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--hairline);
    border-radius: 8px; padding: 10px 14px; margin-bottom: 20px;
  }
  .icon-dot {
    width: 20px; height: 20px; border-radius: 50%;
    background: rgba(8,145,178,0.12); flex-shrink: 0;
  }
  .nav-label { font-size: 14px; font-weight: 500; flex: 1; }
  .badge {
    min-width: 20px; height: 20px; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    padding: 0 6px; color: #fff; font-weight: 700;
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
  }
  .stat { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .stat-label { font-size: 12px; color: var(--muted); }
  .caption {
    font-size: 12px; color: var(--muted); margin-top: 20px;
    padding-top: 16px; border-top: 1px solid var(--hairline);
  }
</style>
</head>
<body>

  <div class="cols">
    <div class="col">
      <div class="label">CURRENT</div>
      <div class="nav-item">
        <div class="icon-dot"></div>
        <div class="nav-label">Reviews</div>
        <div class="badge" style="background: var(--red);">6</div>
      </div>
      <div class="stat" style="color: var(--red);">6 due</div>
      <div class="stat-label">reviews waiting</div>
    </div>

    <div class="col">
      <div class="label">PROPOSED</div>
      <div class="nav-item">
        <div class="icon-dot"></div>
        <div class="nav-label">Reviews</div>
        <div class="badge" style="background: var(--cyan);">6</div>
      </div>
      <div class="stat" style="color: var(--cyan);">6 due</div>
      <div class="stat-label">reviews waiting</div>
    </div>
  </div>

  <div class="caption">Red reads as an unpaid bill; cyan reads as an invitation.</div>

</body>
</html>
