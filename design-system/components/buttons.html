<!-- @dsCard group="Components" name="Buttons" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Buttons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f9f9f6; --surface: #ffffff; --ink: #0F172A; --muted: #64748B;
    --hairline: rgba(15,23,42,0.10); --red: #ba1a1a; --amber: #B45309;
    --teal: #0F766E; --cyan: #0891B2;
  }
  * { box-sizing: border-box; }
  body { margin:0; background: var(--paper); font-family: 'Inter', system-ui, sans-serif; padding: 24px; color: var(--ink); }
  .label {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--muted); margin-bottom: 12px;
  }
  .row { display: flex; gap: 12px; align-items: center; margin-bottom: 28px; }
  button {
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 14px; font-weight: 500; cursor: default;
    border-radius: 4px; padding: 12px 24px; border: none;
  }
  .btn-primary {
    background: linear-gradient(90deg, #0891B2, #0E7490);
    color: #fff;
  }
  .btn-secondary {
    background: #fff; border: 1px solid var(--hairline); color: var(--ink);
  }
  .btn-ghost {
    background: transparent; color: var(--muted); padding: 12px 16px;
  }
  .btn-outcome {
    background: #fff; border-width: 1px; border-style: solid;
    padding: 10px 18px; font-weight: 500; display: flex;
    align-items: center; gap: 8px;
  }
  .kbd {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    opacity: 0.5;
  }
</style>
</head>
<body>

  <div class="label">PROPOSED — primary actions</div>
  <div class="row">
    <button class="btn-primary">Log activity</button>
    <button class="btn-secondary">Cancel</button>
    <button class="btn-ghost">Skip for now</button>
  </div>

  <div class="label">PROPOSED — review outcomes</div>
  <div class="row">
    <button class="btn-outcome" style="border-color: #ba1a1a; color: #ba1a1a;">Missed <span class="kbd">1</span></button>
    <button class="btn-outcome" style="border-color: #B45309; color: #B45309;">Hard <span class="kbd">2</span></button>
    <button class="btn-outcome" style="border-color: #0891B2; color: #0891B2;">Good <span class="kbd">3</span></button>
    <button class="btn-outcome" style="border-color: #0F766E; color: #0F766E;">Easy <span class="kbd">4</span></button>
  </div>

</body>
</html>
